version: '3.8'

services:
  ocr-service-problem-2:
    build: ./ocr_service_problem_2
    container_name: pdf2fhir
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
    volumes:
      - ./pdf_uploads:/app/pdf_uploads
      - ./fhir_results_problem_2:/app/fhir_results_problem_2
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro

  ocr-service-problem-3:
    build: ./ocr_service_problem_3
    container_name: pdf2nhcx
    ports:
      - "8001:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
    volumes:
      - ./pdf_uploads:/app/pdf_uploads
      - ./nhcx_results_problem_3:/app/nhcx_results_problem_3
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend-service
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - ocr-service-problem-2
      - ocr-service-problem-3