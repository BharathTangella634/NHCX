
services:
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  pdf2abdm:
    build:
      context: .
      dockerfile: pdf2abdm/Dockerfile
    container_name: pdf2abdm
    ports:
      - "8000:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
      - GCS_CREDENTIALS_JSON=/app/gcs-service-account.json
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./pdf_uploads:/app/pdf_uploads
      - ./fhir_results:/app/fhir_results
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
      - ./gcs-service-account.json:/app/gcs-service-account.json:ro
    depends_on:
      - redis

  pdf2nhcx:
    build:
      context: .
      dockerfile: pdf2nhcx/Dockerfile
    container_name: pdf2nhcx
    ports:
      - "8001:8000"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
      - GCS_CREDENTIALS_JSON=/app/gcs-service-account.json
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./pdf_uploads:/app/pdf_uploads
      - ./nhcx_results:/app/nhcx_results
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
      - ./gcs-service-account.json:/app/gcs-service-account.json:ro
    depends_on:
      - redis

  celery-worker:
    build:
      context: .
      dockerfile: pdf2nhcx/Dockerfile # Re-use P3 Dockerfile as it has all deps
    container_name: celery-worker
    command: celery -A common.celery_app worker --loglevel=info --concurrency=2 -I pdf2abdm.tasks,pdf2nhcx.tasks
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-service-account.json
      - GCS_CREDENTIALS_JSON=/app/gcs-service-account.json
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./pdf_uploads:/app/pdf_uploads
      - ./fhir_results:/app/fhir_results
      - ./nhcx_results:/app/nhcx_results
      - ./gcp-service-account.json:/app/gcp-service-account.json:ro
      - ./gcs-service-account.json:/app/gcs-service-account.json:ro
    depends_on:
      - redis

  frontend:
    build: 
      context: .
      dockerfile: frontend/Dockerfile
    container_name: frontend-service
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - pdf2abdm
      - pdf2nhcx