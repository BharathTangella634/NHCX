# Enable required modules for reverse proxy
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule headers_module modules/mod_headers.so
LoadModule rewrite_module modules/mod_rewrite.so

# Proxy: forward /pdf2abdm/* → pdf2abdm container on port 8000
# Proxy: forward /pdf2nhcx/* → pdf2nhcx container on port 8001

ProxyPreserveHost On

# pdf2abdm — all paths under /pdf2abdm/ and /pdf2fhir/
ProxyPass        /pdf2abdm/  http://pdf2abdm:8000/pdf2abdm/
ProxyPassReverse /pdf2abdm/  http://pdf2abdm:8000/pdf2abdm/

ProxyPass        /pdf2fhir/  http://pdf2abdm:8000/pdf2fhir/
ProxyPassReverse /pdf2fhir/  http://pdf2abdm:8000/pdf2fhir/

# pdf2nhcx — all paths under /pdf2nhcx/ and /ocr-service-problem-3/
ProxyPass        /pdf2nhcx/  http://pdf2nhcx:8000/pdf2nhcx/
ProxyPassReverse /pdf2nhcx/  http://pdf2nhcx:8000/pdf2nhcx/

ProxyPass        /ocr-service-problem-3/  http://pdf2nhcx:8000/ocr-service-problem-3/
ProxyPassReverse /ocr-service-problem-3/  http://pdf2nhcx:8000/ocr-service-problem-3/

# Strip trailing-slash-less paths too (POST /pdf2abdm without trailing slash)
ProxyPass        /pdf2abdm  http://pdf2abdm:8000/pdf2abdm
ProxyPassReverse /pdf2abdm  http://pdf2abdm:8000/pdf2abdm

ProxyPass        /pdf2nhcx  http://pdf2nhcx:8000/pdf2nhcx
ProxyPassReverse /pdf2nhcx  http://pdf2nhcx:8000/pdf2nhcx
