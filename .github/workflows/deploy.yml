name: Deploy to VM

# ─── Trigger ────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main

# ─── Concurrency guard ──────────────────────────────────────────────────────
# Prevents two deployments from running in parallel on the same VM.
concurrency:
  group: deploy-production
  cancel-in-progress: false   # queue, don't cancel — let the first finish

jobs:
  deploy:
    name: SSH Deploy → 35.200.133.45
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Write SSH private key from GitHub Secret ───────────────────────
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # ── 2. Pull latest code on the VM ────────────────────────────────────
      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
              set -e
              echo "📥 Pulling latest code..."
              cd ~/NHCX_HACKATHON
              git fetch origin main
              git reset --hard origin/main
              echo "✅ Code updated to commit: $(git rev-parse --short HEAD)"
          ENDSSH

      # ── 3. Rebuild & restart Docker services ─────────────────────────────
      - name: Rebuild & restart containers
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=60 \
            -o ServerAliveCountMax=20 \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
              set -e
              cd ~/NHCX_HACKATHON

              echo "🐳 Rebuilding changed services..."
              docker compose build --parallel

              echo "🚀 Restarting containers..."
              docker compose up -d --remove-orphans

              echo "🧹 Pruning unused Docker images..."
              docker image prune -f

              echo "✅ Deployment complete!"
              docker compose ps
          ENDSSH

      # ── 4. Smoke-test health endpoints ───────────────────────────────────
      - name: Smoke test health endpoints
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'ENDSSH'
              echo "🩺 Waiting for containers to be ready..."
              sleep 10

              check() {
                local name="$1" url="$2"
                if curl -sf --max-time 10 "$url" > /dev/null; then
                  echo "  ✅ $name is healthy"
                else
                  echo "  ❌ $name health check FAILED at $url"
                  exit 1
                fi
              }

              check "ABDM API"       "http://localhost:8000/health"
              check "NHCX API"       "http://localhost:8001/health"
              check "Frontend"       "http://localhost:8080"
              check "Session Logger" "http://localhost:8002/health"
          ENDSSH

      # ── 5. Always remove the private key from the runner ─────────────────
      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      # ── 6. Report failure ─────────────────────────────────────────────────
      - name: Report failure
        if: failure()
        run: |
          echo "::error::Deployment to ${{ secrets.VM_HOST }} FAILED — see logs above."
          echo "Commit : ${{ github.sha }}"
          echo "Author : ${{ github.actor }}"
